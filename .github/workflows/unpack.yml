name: Publicar projeto DevShowcase

on:
  push:
    paths:
      - '.github/workflows/unpack.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Montar e extrair projeto
        shell: bash
        run: |
          cat .devshowcase.part00 .devshowcase.part01 .devshowcase.part02 .devshowcase.part03 > project.zip.b64
          base64 -d project.zip.b64 > project.zip
          unzip -o project.zip
          git checkout -- README.md
          rm -f project.zip project.zip.b64 .devshowcase.part00 .devshowcase.part01 .devshowcase.part02 .devshowcase.part03
          rm -f .github/workflows/unpack.yml

      - name: Publicar arquivos no GitHub
        shell: bash
        run: |
          git config user.name 'Augusto Campos'
          git config user.email '324619189+aluno123br@users.noreply.github.com'
          git add -A
          git commit -m 'Publica código completo das Etapas 1 e 2'
          git push
